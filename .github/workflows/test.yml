name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pantry-pm/pantry/packages/action@362da3ef0602f51232ab9431da8d05c84c5f49ba # v0.11.197
        with:
          version: '0.11.197'
          install: 'false'
          packages: bun.com@1.4.4
      - run: bun install --frozen-lockfile
      - name: Verify removed third-party packages stay out of the workspace
        run: |
          if grep -Eq '"(prompts|@types/dom-speech-recognition|data-uri-to-buffer)"' bun.lock; then
            printf 'The workspace lockfile includes a removed third-party package\n' >&2
            exit 1
          fi
      - name: Install the MathML font used by Chrome on Linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-lmodern
          fc-match --format '%{family}\n' 'Latin Modern Math' | grep -Fx 'Latin Modern Math'
      - name: Verify Chrome for browser tests
        run: |
          chrome=$(command -v google-chrome)
          "$chrome" --version
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
      - run: bun run lint
      - run: bun run typecheck
      - name: Run all Bun tests
        run: bun test --timeout 45000 --reporter junit --reporter-outfile "$RUNNER_TEMP/bun-test.xml"
      - name: Verify every mapped Slidev case ran
        run: bun test/verify-slidev-report.ts "$RUNNER_TEMP/bun-test.xml"
      - name: Build charts from the packed CLI
        run: |
          smoke=$(mktemp -d "$RUNNER_TEMP/presentation-package.XXXXXX")
          trap 'rm -rf "$smoke"' EXIT
          archive=$(bun pm pack --destination "$smoke" --quiet)
          cd "$smoke"
          printf '{"private":true,"type":"module"}\n' > package.json
          bun add --no-cache "$archive"
          if grep -Fq '"data-uri-to-buffer"' bun.lock; then
            printf 'Standalone installation pulled in the removed GIF dependency\n' >&2
            exit 1
          fi
          cat > slides.md <<'EOF'
          # Standalone chart build

          ~~~mermaid
          gantt
            todayMarker off
            Draft :draft, 2030-01-01, 2d
            Ship :milestone, after draft, 0d
          ~~~

          ~~~mermaid
          gitGraph
            commit id: "Start"
            branch review
            commit id: "Review"
          ~~~

          ~~~mermaid
          mindmap
            root((Project))
              review[Review]
          ~~~

          ~~~charts
          type: treemap
          nodes:
            - label: Review
              value: 2
          ~~~
          EOF
          bun run ts-presentation build slides.md --out dist
          for kind in gantt gitgraph mindmap treemap; do
            if ! grep -Fq "data-diagram-kind=\"$kind\"" dist/index.html; then
              printf 'Missing %s from the packed deck build\n' "$kind" >&2
              exit 1
            fi
          done
          test ! -e node_modules/@ts-charts/hierarchy
