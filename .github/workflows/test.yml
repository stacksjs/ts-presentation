name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pantry-pm/pantry/packages/action@362da3ef0602f51232ab9431da8d05c84c5f49ba # v0.11.197
        with:
          version: '0.11.197'
          install: 'false'
          packages: bun.com@1.4.4
      - run: bun install --frozen-lockfile
      - name: Verify Chrome for browser tests
        run: |
          chrome=$(command -v google-chrome)
          "$chrome" --version
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test --timeout 45000
